BUILD_MINIMAL="no"
BRANCH="current"
KERNEL_GIT="full"
BUILD_DESKTOP="no"
RELEASE="trixie"
KERNEL_CONFIGURE="no"
HOST="carjack"

function custom_apt_repo__add_waydroid() {
	curl --progress-bar --proto '=https' --tlsv1.2 -Sf https://repo.waydro.id/waydroid.gpg --output "${SDCARD}"/usr/share/keyrings/waydroid.gpg
	run_host_command_logged echo "deb [signed-by=/usr/share/keyrings/waydroid.gpg] https://repo.waydro.id/ ${RELEASE} main" "|" tee "${SDCARD}"/etc/apt/sources.list.d/waydroid.list
}

function user_config__010_carjack_packages() {
    display_alert "carjack packages" "custom" "info"

    add_packages_to_rootfs cage waypipe \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad pulseaudio waydroid
}

function post_family_tweaks__preset_configs() {
	display_alert "$BOARD" "preset configs for rootfs" "info"

	# Preset root password
	echo "PRESET_ROOT_PASSWORD=carjack" >> "${SDCARD}"/root/.not_logged_in_yet

	# Preset username
	echo "PRESET_USER_NAME=carjack" >> "${SDCARD}"/root/.not_logged_in_yet

	# Preset user password
	echo "PRESET_USER_PASSWORD=carjack" >> "${SDCARD}"/root/.not_logged_in_yet

	# Preset user default realname
	echo "PRESET_DEFAULT_REALNAME=Carjack" >> "${SDCARD}"/root/.not_logged_in_yet
}

BOARD="radxa-dragon-q6a"
BRANCH="current"
KERNEL_GIT="full"
BUILD_MINIMAL="yes"
RELEASE="trixie"
KERNEL_CONFIGURE="no"

enable_extension ufs

function user_config__010_extra_packages() {
    display_alert "extra packages" "custom" "info"

    add_packages_to_rootfs avahi-daemon cage \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad
    }

function post_family_tweaks__010_init_waydroid() {
    curl -s https://repo.waydro.id | bash
    apt-get install -y waydroid
    waydroid init
}

function post_family_tweaks__preset_configs() {
	display_alert "$BOARD" "preset configs for rootfs" "info"

	# Preset root password
	echo "PRESET_ROOT_PASSWORD=carjack" >> "${SDCARD}"/root/.not_logged_in_yet

	# Preset username
	echo "PRESET_USER_NAME=carjack" >> "${SDCARD}"/root/.not_logged_in_yet

	# Preset user password
	echo "PRESET_USER_PASSWORD=carjack" >> "${SDCARD}"/root/.not_logged_in_yet

	# Preset user default realname
	echo "PRESET_DEFAULT_REALNAME=Carjack" >> "${SDCARD}"/root/.not_logged_in_yet
}

# Installed as /etc/systemd/system/iwd.service.d/carjack-state.conf (or the deb's
# /usr/lib/systemd/system/... equivalent).
#
# iwd has no API for provisioning a network, so carjack writes the accessory's profile straight
# into iwd's state directory (src/wifi_connect/iwd.rs). Stock iwd.service leaves that directory
# root:root 0700, which would leave carjack needing CAP_DAC_OVERRIDE to get in - a capability that
# is a write to every file on the system, for a grant that should reach exactly one directory.
# Handing the directory to a group carjack is in scopes it to that one path.
#
# iwd keeps running as uid 0; only its primary group moves, so the profiles it writes stay 0600 and
# nothing new becomes readable. The group is not optional - systemd refuses to start a unit whose
# Group= does not resolve - so whatever installs this file creates iwd-provision first (see the
# deb's postinst, `just install-carjack-service`, and the image build's config-carjack.conf).
[Service]
Group=iwd-provision
StateDirectoryMode=0770

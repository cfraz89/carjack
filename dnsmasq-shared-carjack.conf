# Read by the dnsmasq NetworkManager spawns for `ipv4.method=shared` connections - the setup AP in
# src/wifi_connect/setup_ap.rs. NetworkManager passes this directory as --conf-dir; it is separate
# from /etc/NetworkManager/dnsmasq.d/, which configures the DNS-plugin instance instead.
#
# DHCP option 114 is RFC 8910: it hands clients the config portal's URL directly, so iOS 14+ and
# Android 11+ open it without any DNS interception. Older clients ignore the option and reach the
# portal by typing the address.
#
# The address is pinned by the AP profile (AP_ADDRESS) and the port by [portal] port, so both
# halves of this URL are known before the AP comes up. Change either and change this too.
dhcp-option-force=114,http://10.42.0.1:8080/

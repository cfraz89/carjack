# The head unit browses our whole service list and we want a phone's shape, not a speaker's.
# Dropping the sink and headset roles removes Audio Sink, Headset, Headset-HS and Hands-Free HF,
# none of which an iPhone advertises; a2dp_source stays because it does. It also hands the
# hands-free gateway UUID (0x111f) to carjack, which BlueZ allows only one holder of and which
# PipeWire otherwise answers with ERROR, having no modem behind it.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_source ]
}

# BlueZ allows one holder of the hands-free gateway UUID (0x111f) and PipeWire claims it at login,
# where it answers the head unit's identity probe with ERROR - it has no modem behind it. Only the
# gateway roles are dropped; the rest of Bluetooth audio is untouched.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source asha_sink hsp_hs hfp_hf ]
}

[package]
name = "iap2-proto"
version = "0.1.0"
edition.workspace = true

[lib]
name = "iap2_proto"
path = "src/lib.rs"

[dependencies]
backon = { version = "1.6.0", features = ["tokio"] }
bytes = "1.12.1"
deku = "0.20.3"
futures = "0.3.32"
pretty-hex = "0.4.2"
tap = "1.0.1"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1.44"

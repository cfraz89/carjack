[package]
name = "libcarjack"
version = "0.1.0"
edition = "2021"

[lib]
name = "libcarjack"
path = "src/lib.rs"

[dependencies]
bytes = "1.12.1"
catplay_carplay = { git = "https://github.com/cfraz89/catplay.git", branch = "fix/airplay-device-identity", default-features = false, features = ["tx"]}
catplay_hap = { git = "https://github.com/cfraz89/catplay.git", branch = "fix/airplay-device-identity", default-features=false, features = ["std"] }
catplay_util = { git = "https://github.com/cfraz89/catplay.git", branch = "fix/airplay-device-identity" }
deku = "0.20.3"
eyre = "0.6.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
iap2-proto = { version = "0.1.0", path = "../iap2-proto" }
tap = "1.0.1"
tokio = { version = "1.52.3", features = ["rt", "sync", "time"] }
tracing = "0.1.44"
usb = "0.3.0"
uuid = "1.23.3"

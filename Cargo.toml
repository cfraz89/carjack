[workspace]
resolver = "3"
members = [
    "carjack-linux",
    "carjack-android",
    "iap2-proto",
    "libcarjack",
    "cuda-dmabuf",
]
# A bare `cargo build`/`cargo run` is the Linux app; the Android core builds through `just android`.
default-members = ["carjack-linux"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

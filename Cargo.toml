[workspace]

[workspace.package]
edition = "2024"

[package]
name = "carjack"
version = "0.1.0"
edition.workspace = true

[dependencies]
ashpd = {version = "0.13.10", features = ["remote_desktop", "screencast"]  }
color-eyre = "0.6.5"
eyre = "0.6.12"
gst = { package = "gstreamer", version = "0.25.2" }
libcarjack = { path = "libcarjack" }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

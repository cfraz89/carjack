# carjack's config portal runs inside the user service (src/setup_portal), which has no
# CAP_NET_BIND_SERVICE - a user unit cannot be granted ambient capabilities, because the user
# manager is itself unprivileged. Without this it falls back to port 8080, and the DHCP option 114
# URL in dnsmasq-shared-carjack.conf, which names port 80, sends phones to a closed port.
#
# 80 rather than 0: this lowers the privileged range by exactly the one port carjack needs, and
# leaves every other service port (443, 631, ...) protected.
net.ipv4.ip_unprivileged_port_start = 80

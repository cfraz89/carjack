# The androidx versions are those of motopod's Android tree (prebuilts/sdk/current/androidx).
[versions]
agp = "9.5.1"
kotlin = "2.4.21"
compose = "1.10.0-alpha01"
material3 = "1.4.0-alpha17"
lifecycle = "2.10.0-alpha04"

[libraries]
androidx-compose-runtime_runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
androidx-compose-ui_ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
androidx-compose-foundation_foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
androidx-compose-material3_material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-activity_activity-compose = { module = "androidx.activity:activity-compose", version = "1.12.0-alpha08" }
androidx-lifecycle_lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-annotation_annotation = { module = "androidx.annotation:annotation", version = "1.11.0-alpha01" }
androidx-core_core = { module = "androidx.core:core", version = "1.19.0-alpha01" }
androidx-lifecycle_lifecycle-common-java8 = { module = "androidx.lifecycle:lifecycle-common-java8", version.ref = "lifecycle" }
androidx-lifecycle_lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }

[bundles]
compose = [
    "androidx-compose-runtime_runtime",
    "androidx-compose-ui_ui",
    "androidx-compose-foundation_foundation",
    "androidx-compose-material3_material3",
    "androidx-activity_activity-compose",
    "androidx-lifecycle_lifecycle-runtime-compose",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
